<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة التلاميذ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التلاميذ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--g1:#075e54;--g2:#128c7e;--g3:#25d366;--bg:#efeae2;--card:#fff;--text:#111b21;--muted:#667781;--line:#e9edef;--red:#e53935;--amber:#f59e0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--card:#111b21;--text:#e9edef;--muted:#8696a0;--line:#222d34}}
:root[data-theme="dark"]{--bg:#0b141a;--card:#111b21;--text:#e9edef;--muted:#8696a0;--line:#222d34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#d1d7db;color:var(--text);display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{background:var(--g1);color:#fff;padding:12px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h2{margin:0;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0 8px}
.pill{background:#fff3;border-radius:10px;padding:2px 8px;font-size:12px}
.datebar{background:var(--card);padding:8px 12px;gap:8px;align-items:center;justify-content:center;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap}
.datebar input{background:var(--bg);color:var(--text);border:0;border-radius:16px;padding:6px 12px;font:inherit}
.scroll{flex:1;overflow-y:auto;padding-bottom:84px}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:#94a3b8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
.av.ok{background:var(--g2)} .av.bad{background:var(--red)}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;padding:3px 9px;border-radius:10px;color:#fff;white-space:nowrap}
.b-p{background:var(--g3)} .b-a{background:var(--red)} .b-r{background:var(--amber)}
.nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.nav button.on{color:var(--g2);font-weight:700}
.nav span{display:block;font-size:20px}
.fab{position:absolute;bottom:84px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--g2);color:#fff;border:0;font-size:28px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:30px 20px;line-height:1.8}
.muted{color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.sec{padding:12px 14px 0}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.seg button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.seg button.on.a{background:var(--red);border-color:var(--red)}
.seg button.on.r{background:var(--amber);border-color:var(--amber)}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}
textarea{min-height:110px}
.btn{background:var(--g2);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;width:100%;cursor:pointer;margin-top:10px}
.btn.gh{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.chipbtn{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.chipbtn.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.row2{display:flex;gap:8px;margin-top:6px}
.row2>*{flex:1}
.ex{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ex .grow{flex:1}
.ex button{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer}
.del{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;font-size:14px}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 14px 0}
.card2{background:var(--card);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.card2 b{display:block;font-size:20px}
.card2 span{font-size:12px;color:var(--muted)}
.barrow{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line);font-size:14px}
.bn{width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar div{height:100%;background:var(--g2)} .bar div.bad{background:var(--red)}
.bv{width:40px;text-align:left;font-weight:600}
.tablewrap{overflow-x:auto;padding:0 10px}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}
th{color:var(--muted);font-weight:600}
td input{width:76px;padding:6px}
td select{width:92px;padding:6px}
td:first-child{text-align:right;white-space:nowrap}

.top{background:linear-gradient(135deg,#075e54,#128c7e);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav{box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nav span{transition:transform .2s}
.nav button.on span{transform:scale(1.15)}
.item{transition:background .15s}
.item:hover{background:var(--bg)}
.av{box-shadow:0 1px 4px rgba(0,0,0,.15)}
.btn{box-shadow:0 3px 8px rgba(18,140,126,.25);transition:transform .1s}
.btn:active{transform:scale(.98)}
.card2{box-shadow:0 1px 4px rgba(0,0,0,.06)}
.greet{font-size:20px;font-weight:700;margin-bottom:4px}
.profile{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#075e54,#128c7e);color:#fff;border-radius:16px;padding:16px;margin:12px 14px 0}
.pav{width:54px;height:54px;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.card3{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card3 h4{margin:0 0 6px;font-size:15px;color:var(--g2)}
.card3 label{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
.card3 input,.card3 select{margin-top:4px;color:var(--text)}
.note{font-size:12px;color:var(--muted)}

#app{background:var(--bg)}
.top{border-radius:0 0 18px 18px;gap:10px}
#logo{height:34px;border-radius:8px;background:#fff;padding:2px}
.item{margin:6px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.item:hover{background:var(--card);filter:brightness(1.02)}
.nav{border-radius:18px 18px 0 0}
.fab{background:linear-gradient(135deg,#25d366,#128c7e)}
.greet{background:linear-gradient(135deg,#075e54,#128c7e);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.card2{border-radius:14px;padding:12px}
.card2 b{font-size:22px;color:var(--g2)}
.card3{border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card3 img{max-width:100%;border-radius:12px;margin-top:6px}
.badge{box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sec.lbl,.lbl{letter-spacing:.2px}

:root{--g1:#374151;--g2:#4b5563;--g3:#6b7280;--bg:#f3f4f6;--card:#ffffff;--text:#111827;--muted:#6b7280;--line:#e5e7eb}
.top{background:var(--g1);box-shadow:none;border-radius:0}
.nav{box-shadow:none;border-radius:0;border-top:1px solid var(--line)}
.nav button.on{color:var(--g1)}
.nav button.on span{transform:none}
.fab{background:var(--g1);box-shadow:none}
.btn{background:var(--g1);box-shadow:none;border-radius:6px}
.btn.gh{background:var(--card)}
.btn:active{transform:none}

.item:hover{filter:none}
.av{box-shadow:none;background:var(--g3)}
.av.ok{background:var(--g2)} .av.bad{background:#b91c1c}

.card2,.card3{box-shadow:none;border-radius:6px}

.card3 h4{color:var(--g1)}

.chipbtn.on,.seg button.on{background:var(--g2);border-color:var(--g2)}
.badge{box-shadow:none;border-radius:4px}

.barrow{background:var(--card)}

:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --bg:#0b1020;--card:#131a2e;--text:#f4f6fb;--muted:#8b93a7;--line:#1f2a44;
  --g1:#131a2e;--g2:#c6ff3d;--g3:#7c8cff;--red:#ff5c7a;--amber:#ffb84d;--on:#0b1020}

  --bg:#f6f4ef;--card:#ffffff;--text:#0b1020;--muted:#6b7280;--line:#e6e2d8;
  --g1:#ffffff;--g2:#5b4cff;--g3:#8b84ff;--red:#e11d48;--amber:#d97706;--on:#ffffff}
body{background:var(--bg)}
#app{background:var(--bg)}
.top{background:var(--card);color:var(--text);border-bottom:1px solid var(--line);box-shadow:none;border-radius:0;min-height:64px;padding:14px 16px}
.top h2{font-size:22px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.top button{color:var(--g2)}
.pill{background:var(--g2);color:var(--on);font-weight:700}
.datebar{background:var(--bg);border-bottom:1px solid var(--line)}
.datebar input,.chipbtn{background:var(--card);color:var(--text);border:1px solid var(--line)}
.chipbtn.on{background:var(--g2);color:var(--on);border-color:var(--g2)}
.greet{background:none;-webkit-text-fill-color:currentColor;color:var(--text);font-size:24px;font-weight:800;letter-spacing:-.4px;display:block;margin:6px 0 2px}
.item{margin:8px 12px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:14px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--card);filter:none}
.av{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--g3),var(--g2));color:var(--on);box-shadow:none;font-weight:800}
.av.ok{background:linear-gradient(135deg,var(--g2),#7fff7a);color:var(--on)}
.av.bad{background:linear-gradient(135deg,var(--red),#ff9a6b);color:#fff}
.name{font-size:16px;font-weight:700;color:var(--text)}
.sub{color:var(--muted)}
.nav{background:var(--card);border-top:1px solid var(--line);box-shadow:none;border-radius:0}
.nav button{color:var(--muted);font-weight:600}
.nav button.on{color:var(--g2);font-weight:800}
.nav span{transform:none}
.nav button.on span{transform:scale(1.1)}
.fab{background:var(--g2);color:var(--on);box-shadow:0 10px 28px rgba(198,255,61,.25);font-weight:700;width:60px;height:60px;bottom:90px}
.btn{background:var(--g2);color:var(--on);box-shadow:none;border-radius:14px;font-weight:800;padding:14px;letter-spacing:.2px}
.btn.gh{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn:active{transform:scale(.98)}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--text)}
.sheet{background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--line)}
.sheet h3{font-size:20px;font-weight:800}
.seg button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;font-weight:700}
.seg button.on,.seg button.on.p,.seg button.on.r{background:var(--g2);color:var(--on);border-color:var(--g2)}
.seg button.on.a{background:var(--red);color:#fff;border-color:var(--red)}
.lbl{color:var(--muted);text-transform:none;font-size:13px}
.cards{gap:10px}
.card2{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:none}
.card2 b{font-size:28px;font-weight:800;color:var(--g2);letter-spacing:-.5px}
.card2 span{color:var(--muted);font-weight:600}
.card3{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:none}
.card3 h4{color:var(--text);font-size:16px;font-weight:800}
.profile{background:linear-gradient(135deg,var(--g3),var(--g2));color:var(--on);border-radius:24px;padding:20px;margin:14px 14px 0;box-shadow:none}
.profile b{font-size:18px}
.pav{background:rgba(0,0,0,.18);color:#fff;width:60px;height:60px}
.barrow{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:6px 12px;padding:10px 14px}

.bar div{background:linear-gradient(90deg,var(--g3),var(--g2));border-radius:99px}
.bar div.bad{background:var(--red)}
.bv{font-weight:800;color:var(--g2)}
table{background:var(--card);border-radius:16px;overflow:hidden}
th{color:var(--muted);text-transform:none}
td,th{border-bottom:1px solid var(--line)}
.badge{border-radius:99px;font-weight:700;padding:4px 10px;box-shadow:none}
.b-p{background:var(--g2);color:var(--on)} .b-a{background:var(--red);color:#fff} .b-r{background:var(--amber);color:var(--on)}
.empty{color:var(--muted)}
a{color:var(--g2)}
#logo{height:38px;max-width:140px;object-fit:contain;border-radius:6px}
</style>
</head>
<body>
<div id="app">
  <div class="top"><button id="back" data-act="back" style="display:none">›</button><img id="logo" alt="" style="display:none"><h2 id="title"></h2><span id="ro" class="pill" style="display:none">للقراءة فقط</span></div>
  <div id="datebar" class="datebar" style="display:none"><input type="date" id="dateIn"><button class="chipbtn" id="bulkBtn" data-act="bulkOpen">تسجيل جماعي</button></div>
  <div id="scroll" class="scroll"></div>
  <button class="fab" id="fab" data-act="fab">+</button>
  <div class="nav">
    <button data-tab="home"><span>💬</span>الأقسام</button>
    <button data-tab="stats"><span>📊</span>الإحصائيات</button>
    <button data-tab="export"><span>📤</span>التصدير</button>
    <button data-tab="settings"><span>⚙️</span>الإعدادات</button>
  </div>
  <div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
</div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" style="display:none">
<script>
const MAX={devoir:20,cahier:20,participation:5,comportement:5};
const SKEY='suivi-settings';
const DEF={teacher:'',school:'',year:'',w:{devoir:50,cahier:20,participation:15,comportement:15},pass:10,abs:5,theme:'auto',photo:'',logo:''};
let SET=JSON.parse(JSON.stringify(DEF));
let W={...DEF.w};
function applySettings(){
  W={...SET.w};
  document.documentElement.dataset.theme=SET.theme==='auto'?'':SET.theme;
}
function loadSettings(){
  try{Object.assign(SET,JSON.parse(localStorage.getItem(SKEY)||'{}'));}catch(e){}
  applySettings();
}
const TN={devoir:'الفروض',cahier:'تصحيح الدفتر',participation:'المشاركة',comportement:'السلوك'};
const PRES={p:['حاضر','b-p'],a:['غائب','b-a'],r:['متأخر','b-r']};
const LS='suivi-v2';
const S={ctype:'bar',cmetric:'avg',tab:'home',cls:null,date:new Date().toISOString().slice(0,10),bulk:false,bulkType:'devoir',bulkLabel:'',sheet:null};
let db=null,user=null,RO=false,roster={},recs=[],importCls=null,importMode='roster',chartObj=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,t)=>x===null?'—':(x*MAX[t]).toFixed(1).replace(/\.0$/,'');
const sortDate=(a,b)=>a.date.localeCompare(b.date);
const curCls=()=>(S.cls&&roster[S.cls])?S.cls:Object.keys(roster)[0];
let Q=Promise.resolve();
const enqueue=f=>(Q=Q.then(f).catch(e=>alert('تعذر الحفظ: '+(e.message||e.code||e))));
const saveLS=()=>{try{localStorage.setItem(LS,JSON.stringify({roster,recs}))}catch(e){}};
function persistRoster(){ if(db) return enqueue(()=>db.doc('roster/main').set({classes:roster})); saveLS(); }

/* ---------- data ---------- */
function findRec(c,st,d,t,l){return recs.find(r=>r.cls===c&&r.student===st&&r.date===d&&r.type===t&&r.label===l);}
async function putRec(old,body){
  if(db){
    if(old) await db.collection('records').doc(old.id).set(body);
    else await db.collection('records').doc().set(body);
    return;
  }
  if(old) Object.assign(old,body); else recs.push({id:'l'+Date.now()+Math.random().toString(36).slice(2,7),...body});
  saveLS(); render();
}
async function delRec(id){
  if(db){ await db.collection('records').doc(id).delete(); return; }
  recs=recs.filter(r=>r.id!==id); saveLS(); render();
}
function setVal(st,t,l,v){
  const c=S.cls,d=S.date,old=findRec(c,st,d,t,l);
  if(v===''||v==null){ if(old) enqueue(()=>delRec(old.id)); return; }
  const body={cls:c,student:st,date:d,type:t,label:l,value:v};
  enqueue(()=>putRec(old,body));
}
function stats(c,n){
  const R=recs.filter(r=>r.cls===c&&r.student===n);
  const avg=t=>{const a=R.filter(r=>r.type===t);return a.length?a.reduce((s,r)=>s+r.value/MAX[t],0)/a.length:null;};
  const v={};for(const t in W)v[t]=avg(t);
  let num=0,den=0;for(const t in W)if(v[t]!==null){num+=W[t]*v[t];den+=W[t];}
  return {ab:R.filter(r=>r.type==='presence'&&r.value==='a').length,re:R.filter(r=>r.type==='presence'&&r.value==='r').length,tot:den?(num/den)*20:null,v};
}
function classStats(c){
  const ss=(roster[c]||[]).map(n=>({n,...stats(c,n)}));
  const pres=recs.filter(r=>r.cls===c&&r.type==='presence');
  const p=pres.filter(r=>r.value==='p').length;
  const wt=ss.filter(s=>s.tot!==null);
  return {ss,count:ss.length,att:pres.length?Math.round(p/pres.length*100):null,avg:wt.length?wt.reduce((a,s)=>a+s.tot,0)/wt.length:null,risk:wt.filter(s=>s.tot<SET.pass).length,ab:pres.filter(r=>r.value==='a').length,re:pres.filter(r=>r.value==='r').length};
}

/* ---------- views ---------- */
function viewHome(){
  const ks=Object.keys(roster);
  const intro=`<div class="sec"><div class="greet">${esc(SET.teacher?'مرحبا، '+SET.teacher:'مرحبا بك')}</div><div class="muted">أضف قسما، أو استورد لائحة كاملة من ملف Excel بدل كتابة التلاميذ واحدا واحدا.</div><div class="row2"><button class="btn" data-act="importHome">استيراد لائحة من Excel</button><button class="btn gh" data-act="tplX">تنزيل نموذج Excel</button></div></div>`;
  if(!ks.length) return intro+`<div class="empty">لا توجد أقسام بعد.</div>`;

async function saveFile(filename,data){
  let dl=null; try{dl=await window.claude.use('downloads');}catch(e){}
  if(!dl) return alert('التنزيل غير متاح في هذه النسخة');
  try{await dl.save({filename,data});}catch(e){ if(e.code!=='declined') alert('تعذر التنزيل'); }
}
async function xlsxSave(filename,sheets){
  if(!window.XLSX) return alert('مكتبة Excel غير متاحة حاليا، تحقق من الاتصال بالإنترنت');
  const wb=XLSX.utils.book_new();
  sheets.forEach(([name,aoa])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name));
  await saveFile(filename,XLSX.write(wb,{bookType:'xlsx',type:'array'}));
}

async function importResults(wb,mode){
  const c=curCls(); if(!c) return alert('أضف قسما أولا');
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:''});
  if(rows.length<2) return alert('الملف فارغ');
  const head=rows[0].map(x=>String(x).trim());
  const ni=Math.max(0,head.findIndex(h=>/التلميذ|الاسم|name|student/i.test(h)));
  const vi=head.findIndex(h=>mode==='grades'?/علامة|نقطة|نقط|grade|note/i.test(h):/حالة|status/i.test(h));
  const di=head.findIndex(h=>/التاريخ|date/i.test(h));
  const vcol=vi>=0?vi:(mode==='grades'?1:2);
  const names=new Set(roster[c]||[]);
  const st={'حاضر':'p','p':'p','present':'p','غائب':'a','a':'a','absent':'a','متأخر':'r','r':'r','late':'r'};
  let ok=0,bad=0;
  for(const r of rows.slice(1)){
    const n=String(r[ni]??'').trim();
    if(!n||!names.has(n)){bad++;continue;}
    if(mode==='grades'){
      const v=Number(r[vcol]);
      if(String(r[vcol]).trim()===''||isNaN(v)||v<0||v>20){bad++;continue;}
      const old=findRec(c,n,S.date,S.impType,S.impLabel);
      enqueue(()=>putRec(old,{cls:c,student:n,date:S.date,type:S.impType,label:S.impLabel,value:v}));ok++;
    }else{
      const k=st[String(r[vcol]).trim().toLowerCase()];
      if(!k){bad++;continue;}
      let d=S.date;
      if(di>=0&&r[di]!==''){d=typeof r[di]==='number'?XLSX.SSF.format('yyyy-mm-dd',r[di]):String(r[di]).slice(0,10);}
      const old=findRec(c,n,d,'presence','');
      enqueue(()=>putRec(old,{cls:c,student:n,date:d,type:'presence',label:'',value:k}));ok++;
    }
  }
  alert('تم استيراد '+ok+' سطرا'+(bad?'\nتم تجاهل '+bad+' سطر (اسم غير موجود في القسم أو قيمة غير صالحة)':''));
  render();
}

/* ---------- استيراد Excel ---------- */
fileIn.addEventListener('change',async()=>{
  const f=fileIn.files[0]; fileIn.value=''; if(!f) return;
  if(!window.XLSX) return alert('مكتبة Excel غير متاحة، تحقق من الاتصال بالإنترنت');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  if(importMode!=='roster'){const m=importMode;importMode='roster';await importResults(wb,m);return;}
  let fallback=importCls;
  if(!fallback && wb.SheetNames.length===1) fallback=(prompt('اسم القسم لهذه اللائحة؟','')||'').trim();
  importCls=null;
  let added=0,newC=0,skipped=0;
  const touched=new Set();
  const add=(c,n)=>{ if(!c||!n){skipped++;return;} touched.add(c); if(!roster[c]){roster[c]=[];newC++;} if(roster[c].includes(n))skipped++; else{roster[c].push(n);added++;} };
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:''});
    if(!rows.length) return;
    const head=rows[0].map(x=>String(x).trim());
    const hasHead=head.some(h=>/^(القسم|التلميذ|الاسم|اسم|class|student|name)/i.test(h));
    const ci=head.findIndex(h=>/^(القسم|class)$/i.test(h));
    const ni=head.findIndex(h=>/^(التلميذ|الاسم|اسم|student|name)/i.test(h));
    const nameCol=ni>=0?ni:0;
    rows.slice(hasHead?1:0).forEach(r=>{
      const n=String(r[nameCol]??'').trim();
      if(!n) return;
      const c=ci>=0?String(r[ci]).trim():(fallback||sn);
      add(c,n);
    });
  });
  await persistRoster();
  if(touched.size===1){S.cls=[...touched][0];S.tab='home';S.bulk=false;}
  alert('تمت إضافة '+added+' تلميذ'+(newC?'، و'+newC+' قسم جديد':'')+(skipped?'\nتم تجاهل '+skipped+' سطر (مكرر أو فارغ)':''));
  render();
});

/* ---------- عرض ---------- */
function readImg(el){
  const f=el.files[0]; if(!f) return;
  if(f.size>300*1024){alert('الصورة كبيرة، اختر صورة أصغر من 300 KB');el.value='';return;}
  const r=new FileReader();
  r.onload=()=>{SET[el.dataset.img]=r.result;try{localStorage.setItem(SKEY,JSON.stringify(SET));}catch(e){alert('تعذر حفظ الصورة');}render();};
  r.readAsDataURL(f);
}
function render(){
  if(S.cls&&!roster[S.cls])S.cls=null;
  const inClass=S.tab==='home'&&S.cls;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  $('#back').style.display=inClass?'block':'none';
  $('#datebar').style.display=inClass?'flex':'none';
  $('#dateIn').value=S.date;
  $('#bulkBtn').textContent=S.bulk?'العودة للقائمة':'تسجيل جماعي';
  $('#bulkBtn').dataset.act=S.bulk?'bulkClose':'bulkOpen';
  $('#title').textContent=inClass?S.cls:({home:'متابعة التلاميذ',stats:'الإحصائيات',export:'التصدير',settings:'الإعدادات'})[S.tab];
  $('#fab').style.display=(S.tab==='home'&&!inClass)?'block':'none';
  $('#ro').style.display=RO?'inline':'none';
  let h;
  if(inClass) h=S.bulk?viewBulk():viewClass();
  else if(S.tab==='home') h=viewHome();
  else if(S.tab==='stats') h=viewStats();
  else if(S.tab==='settings') h=viewSettings();
  else h=viewExport();
  $('#scroll').innerHTML=h;
  const lg=$('#logo');if(SET.logo){lg.src=SET.logo;lg.style.display='block';}else lg.style.display='none';
  if(S.tab==='stats') drawChart();
  if(S.sheet) drawSheet();
}

function drawChart(){
  const cv=$('#chartC'); if(!cv||!window.Chart) return;
  const c=curCls(); if(!c) return;
  const cs=classStats(c), t=S.ctype, pie=t==='pie'||t==='doughnut';
  let labels,data,label;
  if(S.cmetric==='att'&&pie){
    const pr=recs.filter(r=>r.cls===c&&r.type==='presence');
    labels=['حاضر','غائب','متأخر'];data=['p','a','r'].map(k=>pr.filter(r=>r.value===k).length);label='الحضور';
  }else if(S.cmetric==='att'){
    labels=cs.ss.map(x=>x.n);data=cs.ss.map(x=>x.ab);label='عدد الغيابات';
  }else{
    labels=cs.ss.map(x=>x.n);data=cs.ss.map(x=>x.tot===null?0:+x.tot.toFixed(1));label='المعدل /20';
  }
  if(chartObj) chartObj.destroy();
  chartObj=new Chart(cv,{type:t==='hbar'?'bar':t,data:{labels,datasets:[{label,data,backgroundColor:pie?['#25d366','#e53935','#f59e0b']:'#128c7e',borderColor:'#128c7e',tension:.3}]},options:{indexAxis:t==='hbar'?'y':'x',responsive:true,plugins:{legend:{display:pie}},scales:pie?{}:{y:{beginAtZero:true}}}});
}
/* ---------- أحداث ---------- */
const READ_ACTS=['open','back','close','student','bulkOpen','bulkClose','bt','xRoster','xClassRoster','xStats','xReport','tplX','saveSet','resetSet','xAbs'];
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeSheet();return;}
  const nb=e.target.closest('.nav button');
  if(nb){S.tab=nb.dataset.tab;S.cls=null;S.bulk=false;render();return;}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(RO&&!READ_ACTS.includes(a)){alert('هذا التطبيق للقراءة فقط بالنسبة لك');return;}
  if(a==='open'){S.cls=t.dataset.cls;S.tab='home';S.bulk=false;render();}
  else if(a==='back'){S.cls=null;S.bulk=false;render();}
  else if(a==='student'){if(t.dataset.cls)S.cls=t.dataset.cls;S.tab='home';openSheet({type:'student',name:t.dataset.name});render();}
  else if(a==='fab'){openSheet({type:'class'});}
  else if(a==='addStudents'){openSheet({type:'students'});}
  else if(a==='importX'){importCls=S.cls;fileIn.click();}
  else if(a==='importHome'){importCls=null;fileIn.click();}
  else if(a==='bulkOpen'){S.bulk=true;render();}
  else if(a==='bulkClose'){S.bulk=false;render();}
  else if(a==='bt'){S.bulkType=t.dataset.v;render();}
  else if(a==='allPresent'){(roster[S.cls]||[]).forEach(n=>{if(!findRec(S.cls,n,S.date,'presence',''))setVal(n,'presence','','p');});}
  else if(a==='close'){closeSheet();render();}
  else if(a==='set'){
    const type=t.dataset.type,v=type==='presence'?t.dataset.v:Number(t.dataset.v);
    const cur=findRec(S.cls,S.sheet.name,S.date,type,'');
    setVal(S.sheet.name,type,'',cur&&cur.value===v?null:v);
    render();
  }
  else if(a==='addex'){
    const type=$('#exT').value,label=$('#exL').value.trim(),v=$('#exV').value,n=Number(v);
    if(!label){alert('اكتب اسم الفرض أو الدفتر');return;}
    if(v===''||isNaN(n)||n<0||n>20){alert('العلامة يجب أن تكون بين 0 و 20');return;}
    setVal(S.sheet.name,type,label,n);
    render();
  }
  else if(a==='delrec'){enqueue(()=>delRec(t.dataset.id));}
  else if(a==='delstudent'){
    if(!confirm('حذف التلميذ وكل سجلاته؟'))return;
    const n=S.sheet.name;
    roster[S.cls]=roster[S.cls].filter(x=>x!==n);
    recs.filter(r=>r.cls===S.cls&&r.student===n).forEach(r=>enqueue(()=>delRec(r.id)));
    persistRoster();closeSheet();render();
  }
  else if(a==='saveClass'){
    const n=$('#inCls').value.trim();
    if(n&&!roster[n]){roster[n]=[];S.cls=n;S.tab='home';persistRoster();}
    closeSheet();render();
  }
  else if(a==='saveSt'){
    const list=$('#inSt').value.split('\n').map(x=>x.trim()).filter(Boolean);
    list.forEach(n=>{if(!roster[S.cls].includes(n))roster[S.cls].push(n);});
    persistRoster();closeSheet();render();
  }
  else if(a==='delclass'){
    const c=t.dataset.cls;
    if(!confirm('حذف القسم "'+c+'" وكل تسجيلاته؟'))return;
    recs.filter(r=>r.cls===c).forEach(r=>enqueue(()=>delRec(r.id)));
    delete roster[c];
    if(S.cls===c)S.cls=null;
    S.bulk=false;persistRoster();render();
  }
  else if(a==='tplX'){xTemplate();}
  else if(a==='xAbs'){xAbsence(curCls(),S.date);}
  else if(a==='importGrades'){S.impLabel=$('#impLabel').value.trim();S.impType=$('#impType').value;if(!S.impLabel){alert('اكتب اسم الفرض أو الدفتر أولا');return;}importMode='grades';fileIn.click();}
  else if(a==='importAtt'){importMode='att';fileIn.click();}
  else if(a==='saveLink'){
    const u=$('#bLink').value.trim();
    if(!S.bulkLabel.trim()){alert('اكتب اسم الفرض أولا');return;}
    if(u&&!/^https?:\/\//.test(u)){alert('ضع رابطا يبدأ بـ https');return;}
    setVal('','fiche',S.bulkLabel.trim(),u||null);alert('تم حفظ الرابط');
  }
  else if(a==='saveSet'){
    const num=(id,lo,hi)=>{const v=Number($(id).value);return (isNaN(v)||v<lo||v>hi)?null:v;};
    const w={devoir:num('#sDev',0,100),cahier:num('#sCah',0,100),participation:num('#sPart',0,100),comportement:num('#sComp',0,100)};
    const pass=num('#sPass',0,20), abs=num('#sAbs',1,99);
    if(Object.values(w).includes(null)||pass===null||abs===null){alert('تحقق من القيم المدخلة');return;}
    SET={...SET,teacher:$('#sName').value.trim(),school:$('#sSchool').value.trim(),year:$('#sYear').value.trim(),w,pass,abs,theme:$('#sTheme').value};
    try{localStorage.setItem(SKEY,JSON.stringify(SET));}catch(e){}
    applySettings();alert('تم حفظ الإعدادات');render();
  }
  else if(a==='resetSet'){
    if(!confirm('استعادة الإعدادات الافتراضية؟'))return;
    try{localStorage.removeItem(SKEY);}catch(e){}
    SET=JSON.parse(JSON.stringify(DEF));applySettings();render();
  }
  else if(a==='xRoster'){xRoster(null);}
  else if(a==='xClassRoster'){xRoster(curCls());}
  else if(a==='xStats'){xStats(curCls());}
  else if(a==='xReport'){xReport(curCls());}
});
document.addEventListener('change',e=>{
  const c=e.target;
  if(c.dataset.ctl==='statcls'){S.cls=c.value;render();return;}
  if(c.dataset.ctl==='ctype'){S.ctype=c.value;render();return;}
  if(c.dataset.ctl==='cmetric'){S.cmetric=c.value;render();return;}
  if(c.dataset.img){readImg(c);return;}
  if(c.id==='dateIn'){S.date=c.value||S.date;render();return;}
  if(c.id==='bLabel'){S.bulkLabel=c.value;render();return;}
  if(c.dataset.st!==undefined){
    if(RO){alert('هذا التطبيق للقراءة فقط بالنسبة لك');render();return;}
    const st=c.dataset.st,f=c.dataset.f,v=c.value;
    if(f==='presence'){setVal(st,'presence','',v);return;}
    if(f==='exam'){
      const label=S.bulkLabel.trim();
      if(v===''){ if(label) setVal(st,S.bulkType,label,''); return; }
      if(!label){alert('اكتب اسم الفرض أولا');render();return;}
      const n=Number(v); if(isNaN(n)||n<0||n>20){alert('العلامة بين 0 و 20');render();return;}
      setVal(st,S.bulkType,label,n);return;
    }
    if(v===''){setVal(st,f,'',null);return;}
    const n=Number(v); if(isNaN(n)||n<0||n>5){alert('القيمة بين 0 و 5');render();return;}
    setVal(st,f,'',n);
  }
});

/* ---------- البداية ---------- */
async function init(){
  try{ if(window.claude){ db=await window.claude.use('db'); user=await window.claude.use('user'); } }catch(e){}
  try{ if(user){ const w=await user.can('data.write'); RO=(w===false); } }catch(e){}
  if(db){
    db.doc('roster/main').onSnapshot(s=>{roster=(s.exists&&s.data()&&s.data().classes)||{};render();},()=>{});
    db.collection('records').onSnapshot(s=>{recs=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));render();},()=>{});
  }else{
    try{
      const o=JSON.parse(localStorage.getItem(LS)||'null');
      if(o){roster=o.roster||{};recs=o.recs||[];}
      else{ // migration depuis la version précédente
        const v1=JSON.parse(localStorage.getItem('suivi-eleves-v1')||'null');
        if(v1){roster=v1.classes||{};recs=v1.records||[];saveLS();}
      }
    }catch(e){}
  }
  render();
}
loadSettings();
init();
</script>
